<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
  <meta charset="UTF-8"> 
  <title>Carrinho de Compras</title> 
  <link rel="stylesheet" href="style.css"> 
</head>
<audio id="musicaBoasVindas" autoplay>
    <source src="Musica de recepção.mp3" type="audio/mpeg">
    Seu navegador não suporta áudio HTML5.
  </audio>
  
<body> 

  <h1>Carrinho de Compras</h1> 

  <!-- Início do formulário para o usuário preencher os dados do produto -->
  <label for="codigo">Código do Produto:</label> <!-- Texto do campo de código -->
  <input type="text" id="codigo"> <!-- Campo de texto onde o usuário digita o código do produto do tipo texto com um id:codigo -->

  <label for="nome">Nome do Produto:</label> <!-- Texto do campo de código -->
  <input type="text" id="nome"><!-- Campo de texto onde o usuário digita o código do produto do tipo texto com um id:nome -->

  <label for="quantidade">Quantidade:</label> <!-- Texto do campo de código -->
  <input type="number" id="quantidade"> <!-- Campo de texto onde o usuário digita o código do produto do tipo numero com um id:quantidade -->

  <label for="valor">Valor Unitário (R$):</label> <!-- Texto do campo de código -->
  <input type="number" id="valor" step="0.01"> <!-- Campo numérico com casas decimais para o valor do produto -->

  <button onclick="adicionarProduto()">Adicionar ao Carrinho</button> <!-- Botão que chama a função de adicionar o produto -->

  <div id="carrinho"></div> <!-- Div onde será exibido o conteúdo do carrinho -->

  <!-- Modal que aparece quando o usuário tenta sair da página -->
  <div id="modalOferta"> <!-- Div que representa o modal -->
    <div> <!-- Conteúdo interno do modal -->
      <h2>Antes de sair...</h2> <!-- Título do modal -->
      <p>Aproveite nossas ofertas especiais!</p> <!-- Mensagem do modal -->
      <p>20% de desconto ao finalizar sua compra</p>
      <button onclick="fecharModal()">Fechar</button> <!-- Botão que fecha o modal -->
    </div>
  </div>

  <script src="script.js"></script> <!-- Importa o arquivo JavaScript externo -->
</body>
</html>
